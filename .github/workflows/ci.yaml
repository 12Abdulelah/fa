name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -e ".[dev,api]" mypy import-linter

      - name: Ruff
        run: ruff check src tests

      - name: Import Linter
        run: lint-imports

      - name: Mypy
        run: mypy src/fraud_service --strict

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install -e ".[dev,api]"

      - name: Fast test suite
        run: pytest -m "not slow" --cov-fail-under=80

      - name: Behavioural gate
        run: pytest -m "behavioural and not slow" -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  image-smoke:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name svc -p 8000:8000 \
            ${{ env.IMAGE }}:${{ github.sha }}

          for i in $(seq 1 30); do
            curl -fsS localhost:8000/v1/ready && break || sleep 2
          done

          curl -fsS localhost:8000/v1/predict \
            -H "content-type: application/json" \
            -d @payloads/sample.json \
            | python3 -c "import json,sys; b=json.load(sys.stdin); assert 0 <= b['fraud_probability'] <= 1; assert b['model_version']; print('smoke OK')"

          docker logs svc --tail 5

  publish:
    runs-on: ubuntu-latest
    needs:
      - image-smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max